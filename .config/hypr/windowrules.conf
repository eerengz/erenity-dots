# ----------------------------------------------------- 
#  Window Rules
# ----------------------------------------------------- 

# Floats
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(file-roller)$
windowrulev2 = float, title:^(File Operation Progress)$
windowrulev2 = float, title:^(Open File)$
windowrulev2 = float, title:^(Save File)$

# Opacity Rules (Catppuccin styling)
windowrulev2 = opacity 0.90 0.90, class:^(kitty)$
windowrulev2 = opacity 0.90 0.90, class:^(code-oss)$
windowrulev2 = opacity 0.90 0.90, class:^(vscodium)$
windowrulev2 = opacity 0.95 0.95, class:^(thunar)$
windowrulev2 = opacity 0.90 0.90, class:^(rofi)$

# Common App Workspaces
windowrulev2 = workspace 1, class:^(kitty)$
windowrulev2 = workspace 2, class:^(firefox)$
windowrulev2 = workspace 3, class:^(code-oss)$
windowrulev2 = workspace 4, class:^(discord)$
windowrulev2 = workspace 4, class:^(vesktop)$
windowrulev2 = workspace 5, class:^(Spotify)$

# Hyprglass compatibility (disables native blur for hyprglass to work)
# windowrulev2 = plugin:hyprglass, class:^(kitty)$
