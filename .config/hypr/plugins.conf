# ----------------------------------------------------- 
#  Plugins Configuration
# ----------------------------------------------------- 

# Ensure you have hyprpm setup:
# 1. hyprpm update
# 2. hyprpm add https://github.com/someone/hyprglass (or correct repo)
# 3. hyprpm enable hyprglass

plugin {
    # Hyprglass settings
    hyprglass {
        enabled = true
        
        # Intensity settings
        glass_intensity = 0.8
        
        # Refraction/Diffraction params
        refraction_strength = 2.0
        diffraction_strength = 1.5
    }
}
