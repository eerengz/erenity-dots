# ----------------------------------------------------- 
#  Autostart Applications
# ----------------------------------------------------- 

# Core components
exec-once = waybar
exec-once = swaync
exec-once = hypridle

# Wallpaper daemon
# swww paketi AUR'dan (swww-git) kurulmalıdır; binary adı "swww"
exec-once = swww-daemon
exec-once = swww img ~/wallpapers/default.jpg --transition-type grow

# Authentication agent
exec-once = systemctl --user start hyprpolkitagent

# Applets
exec-once = nm-applet --indicator
exec-once = blueman-applet

# Clipboard manager (cliphist)
exec-once = wl-paste --type text --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store

# DynamicGlacier — OPSİYONEL (aur-packages.txt açıklamalarını okuyun)
# Kurulum: paru -S dynamic-glacier-git quickshell-git
# Kurulumdan sonra aşağıdaki satırın başındaki '#' işaretini kaldırın:
#exec-once = DynamicGlacier
