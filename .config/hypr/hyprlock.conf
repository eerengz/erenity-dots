# ----------------------------------------------------- 
#  Hyprlock Configuration - Catppuccin Mocha
# ----------------------------------------------------- 

background {
    monitor =
    path = ~/wallpapers/default.jpg   # fallback
    color = rgb(1e1e2e)

    # Blur properties
    blur_passes = 3
    blur_size = 8
    noise = 0.0117
    contrast = 0.8916
    brightness = 0.8172
    vibrancy = 0.1696
    vibrancy_darkness = 0.0
}

input-field {
    monitor =
    size = 250, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    dots_center = true
    outer_color = rgb(cba6f7) # Mauve
    inner_color = rgb(313244) # Surface0
    font_color = rgb(cdd6f4)  # Text
    fade_on_empty = false
    placeholder_text = <i>󰌾 Password...</i>
    hide_input = false
    position = 0, -120
    halign = center
    valign = center
}

label {
    monitor =
    text = cmd[update:1000] echo "$(date +"%H:%M")"
    color = rgb(cdd6f4) # Text
    font_size = 120
    font_family = JetBrainsMono Nerd Font Bold
    position = 0, 100
    halign = center
    valign = center
}

label {
    monitor =
    text =   $USER
    color = rgb(cdd6f4) # Text
    font_size = 25
    font_family = JetBrainsMono Nerd Font
    position = 0, -40
    halign = center
    valign = center
}
